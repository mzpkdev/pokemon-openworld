name: Issue
description: Report a problem or propose a change.
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What happened or should change?
      placeholder: Describe the outcome in a few sentences.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why does this matter?
      placeholder: Explain the impact on players or contributors.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What observable results must be true before this issue can close?
      placeholder: List concise, verifiable completion criteria.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add evidence, examples, dependencies, constraints, or related issues when useful.
