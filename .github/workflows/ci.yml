name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Python formatting
        run: make format-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Lint Python
        run: make lint-check

      - name: Validate append-only persistent allocations
        env:
          PERSISTENT_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: >-
          python3 -m tools.persistence.ledger validate
          --published-baseline-ref "$PERSISTENT_BASELINE_REF"
          --require-published-baseline
          --allow-published-baseline-bootstrap

  donor-contracts:
    name: Donor Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check imported content ownership
        run: make content-port-ownership-check

      - name: Detect donor-contract changes
        id: donor-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only --no-renames -z "$BASE_SHA"...HEAD -- \
            | python3 -m tools.content_port.ci_scope; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip donor-backed contracts for unrelated changes
        if: steps.donor-scope.outputs.run != 'true'
        run: echo 'No donor-contract inputs changed; donor-backed checks are not required.'

      - name: Checkout HnS content authority
        if: steps.donor-scope.outputs.run == 'true'
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PokemonHnS-Development/pokemonHnS
          ref: 751823abaf677020bcd72c45fe3e7cb2b8a576e4
          path: .references/pokemonHnS
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout PKMN-World mechanical donor
        if: steps.donor-scope.outputs.run == 'true'
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: evilchinesefood/PKMN-World
          ref: d40affe26e58a20f445daad84af5e45be812e69f
          path: .references/PKMN-World
          persist-credentials: false
          fetch-depth: 0

      - name: Authenticate donors and run contracts
        if: steps.donor-scope.outputs.run == 'true'
        shell: bash
        env:
          CONTENT_PORT_REQUIRE_DONORS: "1"
          CONTENT_PORT_DONOR_ROOT: .references
        run: |
          set -o pipefail
          mkdir -p build/content-port
          status=0
          make content-port-transaction-check || status=$?
          if (( status == 0 )); then
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
              -s tools/content_port/tests -p 'test_*.py' -q \
              2>&1 | tee build/content-port/donor-contract.log || status=$?
          fi
          if (( status == 0 )) && grep -Eq 'skipped=[1-9][0-9]*' \
            build/content-port/donor-contract.log; then
            printf '%s\n' 'Donor Contracts requires zero skipped tests.' \
              | tee -a build/content-port/donor-contract.log
            status=1
          fi
          exit "$status"

      - name: Upload donor-contract failure evidence
        if: failure() && steps.donor-scope.outputs.run == 'true'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: donor-contract-failure-evidence
          path: build/content-port/donor-contract.log
          if-no-files-found: warn
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Test SkyEmu installer retry and cache handling
        run: >-
          python3 -W error::ResourceWarning -m unittest
          tools.e2e.tests.unit.test_install_skyemu -v

      - name: Run C mechanics tests
        run: make -j"$(nproc)" -O product-check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build Emerald
        if: github.event_name != 'pull_request'
        run: make -j"$(nproc)" -O normal-artifacts

      - name: Build debug ROM
        run: make -j"$(nproc)" -O debug-artifacts

      - name: Check normal/debug shared debug-menu symbols
        if: github.event_name != 'pull_request'
        run: make build-variant-isolation-check

      - name: Check for modified tracked files
        run: |
          if ! git diff --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff HEAD --
            exit 1
          fi

      - name: Stage debug build files
        run: |
          mkdir debug-release
          cp pokemon-openworld-debug.gba debug-release/pokemon-openworld-debug.gba
          cp pokemon-openworld-debug.map debug-release/pokemon-openworld-debug.map
          cp pokemon-openworld-debug.sym debug-release/pokemon-openworld-debug.sym

      - name: Stage and validate release artifact
        if: github.event_name != 'pull_request'
        run: make -j"$(nproc)" -O SNAPSHOT_DIR=release snapshot-artifacts

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokemon-openworld
          path: release/
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug build artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokemon-openworld-debug
          path: debug-release/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            suite: core
            target: e2e-core
          - name: Integrity
            suite: integrity
            target: e2e-integrity

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore SkyEmu
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: build/e2e-tools/SkyEmu-v5
          key: skyemu-${{ runner.os }}-${{ runner.arch }}-v5-d85797fe449bd97922a3b3f73060db7ebf49ab094ef8f0b0c882fe7357e3c9f3

      - name: Download debug build artifact
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pokemon-openworld-debug
          path: .

      - name: Generate and validate Integrity manifest
        if: ${{ matrix.suite == 'integrity' }}
        run: |
          make -C tools/mapjson
          make NODEP=1 SETUP_PREREQS=0 \
            build/generated/allregions/current/integrity-manifest.json
          python3 tools/integrity/manifest.py \
            build/generated/allregions/current/integrity-manifest.json

      - name: Install E2E runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libopengl0 \
            libstdc++6 \
            libx11-6 \
            libxcursor1 \
            libxi6 \
            python3-venv \
            zlib1g

      - name: Run E2E suite
        run: make E2E_PREBUILT_DEBUG=1 ${{ matrix.target }}

      - name: Upload failure evidence
        if: failure()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ matrix.suite }}-failure-evidence
          path: test-results/e2e/${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 3

  integrity:
    name: ROM Audit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Download release build artifact
        if: github.event_name != 'pull_request'
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pokemon-openworld
          path: build/prebuilt

      - name: Download debug build artifact
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pokemon-openworld-debug
          path: build/debug-prebuilt

      - name: Check deterministic generation and schemas
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/integrity
          python3 -m unittest discover -s tools/mapjson/tests -p 'test_*.py' \
            2>&1 | tee build/integrity/generator-schema.log
          make wild-encounter-test \
            2>&1 | tee build/integrity/wild-encounters.log
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tools/persistence/tests -p 'test_*.py' -q \
            2>&1 | tee build/integrity/persistence.log

      - name: Build and audit release ROM
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" -O release-check \
            INTEGRITY_REPORT=build/integrity/purposes/release.json \
            2>&1 | tee build/integrity/rom-purpose-capacity.log

      - name: Audit prebuilt normal and debug ROMs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            target=audit-prebuilt-artifacts
          else
            target=audit-prebuilt-debug
          fi
          make "$target" 2>&1 | tee -a build/integrity/rom-purpose-capacity.log

      - name: Upload Integrity reports
        if: ${{ always() }}
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrity-evidence
          path: |
            build/integrity/*.log
            build/integrity/purposes/*.json
          if-no-files-found: warn
          retention-days: 3
