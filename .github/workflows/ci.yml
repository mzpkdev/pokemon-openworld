name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run actionlint
        if: github.event_name == 'push' || github.event.action != 'edited'
        # rhysd/actionlint:1.7.12
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Test release policy helper
        if: github.event_name == 'push' || github.event.action != 'edited'
        run: .github/release/release.py self-test

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, for example: feat(battle): add a new encounter"
            exit 1
          fi

  format:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'Format (metadata-only)' || 'Format' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Python formatting
        run: make format-check

  lint:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'Lint (metadata-only)' || 'Lint' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Python
        run: make lint-check

  test:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'Test (metadata-only)' || 'Test' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Run C mechanics tests
        run: make -j"$(nproc)" -O check

  build:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'Build (metadata-only)' || 'Build' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build Emerald
        run: make -j"$(nproc)" -O emerald syms

      - name: Stage build files
        run: |
          mkdir release
          cp pokemon-openworld.gba release/pokemon-openworld.gba
          cp pokemon-openworld.map release/pokemon-openworld.map
          cp pokemon-openworld.sym release/pokemon-openworld.sym

      - name: Build debug ROM
        run: >-
          make -j"$(nproc)" -O DEBUG=1
          pokemon-openworld-debug.gba pokemon-openworld-debug.sym

      - name: Check normal/debug symbol isolation
        run: make build-variant-isolation-check

      - name: Check for modified tracked files
        run: |
          if ! git diff --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff HEAD --
            exit 1
          fi

      - name: Stage debug build files
        run: |
          mkdir debug-release
          cp pokemon-openworld-debug.gba release/pokemon-openworld-debug.gba
          cp pokemon-openworld-debug.gba debug-release/pokemon-openworld-debug.gba
          cp pokemon-openworld-debug.sym debug-release/pokemon-openworld-debug.sym

      - name: Upload build artifacts
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokemon-openworld
          path: release/
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug build artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokemon-openworld-debug
          path: debug-release/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('E2E ({0}) (metadata-only)', matrix.name) || format('E2E ({0})', matrix.name) }}
    needs: build
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            suite: core
            target: e2e-core
          - name: Extended
            suite: extended
            target: e2e-extended
          - name: Integrity
            suite: integrity
            target: e2e-integrity

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download debug build artifact
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pokemon-openworld-debug
          path: .

      - name: Generate and validate Integrity manifest
        if: ${{ matrix.suite == 'integrity' }}
        run: |
          make -C tools/mapjson
          make NODEP=1 SETUP_PREREQS=0 \
            build/generated/allregions/current/integrity-manifest.json
          python3 tools/integrity/manifest.py \
            build/generated/allregions/current/integrity-manifest.json

      - name: Install E2E runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libopengl0 \
            libstdc++6 \
            libx11-6 \
            libxcursor1 \
            libxi6 \
            python3-venv \
            zlib1g

      - name: Run E2E suite
        run: make E2E_PREBUILT_DEBUG=1 ${{ matrix.target }}

      - name: Upload failure evidence
        if: failure()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ matrix.suite }}-failure-evidence
          path: test-results/e2e/${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 3

  integrity:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'ROM Audit (metadata-only)' || 'ROM Audit' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Check deterministic generation and schemas
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/integrity
          python3 -m unittest discover -s tools/mapjson/tests -p 'test_*.py' \
            2>&1 | tee build/integrity/generator-schema.log
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tools/johto_import/tests -p 'test_*.py' -q \
            2>&1 | tee build/integrity/johto-import.log

      - name: Check optimized release capacity
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" -O RELEASE=1 integrity-check \
            2>&1 | tee build/integrity/release-capacity.log

      - name: Upload Integrity reports
        if: ${{ always() }}
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrity-evidence
          path: build/integrity/
          if-no-files-found: error
          retention-days: 3
