name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build Emerald
        run: make -j"$(nproc)" -O emerald syms

      - name: Check for modified tracked files
        run: |
          if ! git diff --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff HEAD --
            exit 1
          fi

      - name: Stage build files
        run: |
          mkdir release
          cp pokeemerald.gba release/pokeemerald.gba
          cp pokeemerald.map release/pokeemerald.map
          cp pokeemerald.sym release/pokeemerald.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-openworld-emerald
          path: release/
          if-no-files-found: error
          retention-days: 3
