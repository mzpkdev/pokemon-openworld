name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build:
    name: Build (${{ matrix.game }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: [emerald, firered, leafgreen]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build ${{ matrix.game }}
        env:
          BUILD: ${{ matrix.game }}
        run: make -j"$(nproc)" -O "$BUILD" syms

      - name: Check for modified tracked files
        run: |
          if ! git diff --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff HEAD --
            exit 1
          fi

      - name: Stage build files
        env:
          BUILD: ${{ matrix.game }}
        run: |
          mkdir release
          cp "poke${BUILD}.gba" "release/poke${BUILD}.gba"
          cp "poke${BUILD}.map" "release/poke${BUILD}.map"
          cp "poke${BUILD}.sym" "release/poke${BUILD}.sym"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-openworld-${{ matrix.game }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check documentation index
        run: .github/docs_validate/inclusive_summary.py

  package:
    name: Package Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build release
        run: make -j"$(nproc)" -O release syms

      - name: Check for modified tracked files
        run: |
          if ! git diff --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokeemerald-release.gba release/pokeemerald-release.gba
          cp pokeemerald-release.map release/pokeemerald-release.map
          cp pokeemerald-release.sym release/pokeemerald-release.sym

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-openworld-build
          path: release/
          if-no-files-found: error
          retention-days: 3
