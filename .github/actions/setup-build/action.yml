name: Set up build dependencies
description: Install and cache the toolchain used to build Pokemon OpenWorld.

runs:
  using: composite
  steps:
    - name: Require an x64 runner
      shell: bash
      run: |
        if [[ "${RUNNER_ARCH}" != "X64" ]]; then
          echo "Unsupported runner architecture: ${RUNNER_ARCH} (expected X64)" >&2
          exit 1
        fi

    - name: Restore Arm GNU Toolchain archive
      id: arm-toolchain-cache
      # actions/cache v5
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        key: arm-gnu-toolchain-${{ runner.os }}-${{ runner.arch }}-13.2.Rel1-6cd1bbc1d9ae5731

    - name: Download Arm GNU Toolchain archive
      if: steps.arm-toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl --fail --location --retry 5 --retry-delay 2 \
          --output "${RUNNER_TEMP}/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" \
          https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz

    - name: Verify and extract Arm GNU Toolchain
      shell: bash
      run: |
        archive="${RUNNER_TEMP}/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz"
        echo "6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb  ${archive}" \
          | sha256sum --check --strict
        tar -xJf "${archive}" -C "${RUNNER_TEMP}"
        toolchain_bin="${RUNNER_TEMP}/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin"
        test -d "${toolchain_bin}"
        echo "${toolchain_bin}" >> "${GITHUB_PATH}"

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libpng-dev \
          pkg-config \
          python3

    - name: Identify native build environment
      id: native-build-environment
      shell: bash
      run: |
        set -o pipefail
        identity="$({
          gcc --version &&
          g++ --version &&
          ld --version &&
          ldd --version &&
          pkg-config --modversion libpng
        } | sha256sum | cut -d' ' -f1)"
        echo "digest=${identity}" >> "$GITHUB_OUTPUT"

    - name: Restore build tools
      id: build-tools-cache
      # actions/cache v5
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          tools/bin2c/bin2c
          tools/gbafix/gbafix
          tools/gbagfx/gbagfx
          tools/jsonproc/jsonproc
          tools/mapjson/mapjson
          tools/mid2agb/mid2agb
          tools/preproc/preproc
          tools/ramscrgen/ramscrgen
          tools/rsfont/rsfont
          tools/scaninc/scaninc
          tools/trainerproc/trainerproc
          tools/compresSmol/compresSmol
          tools/compresSmol/compresSmolTilemap
          tools/wav2agb/wav2agb
        key: gba-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-build-environment.outputs.digest }}-${{ hashFiles('.github/actions/setup-build/action.yml', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'include/config/battle.h', 'include/config/general.h', 'include/constants/characters.h') }}

    - name: Refresh cached build tool timestamps
      if: steps.build-tools-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # The cache key authenticates these binaries against every host-tool
        # source. Refresh them after checkout so fresh source mtimes alone do
        # not make Make rebuild an exact cache hit.
        tools=(
          tools/bin2c/bin2c
          tools/gbafix/gbafix
          tools/gbagfx/gbagfx
          tools/jsonproc/jsonproc
          tools/mapjson/mapjson
          tools/mid2agb/mid2agb
          tools/preproc/preproc
          tools/ramscrgen/ramscrgen
          tools/rsfont/rsfont
          tools/scaninc/scaninc
          tools/trainerproc/trainerproc
          tools/compresSmol/compresSmol
          tools/compresSmol/compresSmolTilemap
          tools/wav2agb/wav2agb
        )
        for tool in "${tools[@]}"; do
          if [[ ! -e "${tool}" ]]; then
            continue
          fi
          if [[ ! -f "${tool}" || -L "${tool}" || ! -x "${tool}" ]]; then
            echo "Cached build tool is not a regular executable: ${tool}" >&2
            exit 1
          fi
          touch -- "${tool}"
        done

    - name: Verify build toolchain
      shell: bash
      run: |
        arm-none-eabi-gcc --version
        for library in libc.a libnosys.a libgcc.a; do
          library_path="$(arm-none-eabi-gcc -print-file-name="${library}")"
          if [[ "${library_path}" == "${library}" || ! -f "${library_path}" ]]; then
            echo "Missing Arm toolchain library: ${library}" >&2
            exit 1
          fi
          echo "${library}: ${library_path}"
        done
        python3 --version
